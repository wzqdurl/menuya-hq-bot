name: Respaldo prospección diaria

# Duplicado del cron menuya-prospeccion-diaria en GitHub Actions.
# SOLO actúa si Muse está caído (verifica /vigilante primero) -> no duplica leads.
# Corre 10:00am hora Costa Rica (16:00 UTC).

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si Muse está vivo
        id: check
        run: |
          CODE=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
            https://menuya-hq-bot-production.up.railway.app/vigilante || echo "000")
          echo "vigilante HTTP $CODE"
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Prospección vía Railway
        if: steps.check.outputs.code != '200'
        run: |
          echo "Muse caído -> respaldo activo: /prospeccion-push a Railway"
          curl -s -m 600 -X POST https://menuya-hq-bot-production.up.railway.app/prospeccion-push \
            -H "X-Bridge-Secret: ${{ secrets.BRIDGE_SECRET }}" \
            -H "Content-Type: application/json" -d '{}'
          echo; echo "prospección de respaldo solicitada"
