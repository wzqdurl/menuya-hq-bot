name: Vigilante externo MenúYa HQ

# Corre en la nube de GitHub (gratis, repo público), independiente de la VM y de Railway.
# Cada 6h verifica que el bot responda; guarda heartbeat en el repo; abre issue si cae.

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chequear salud del bot
        id: check
        run: |
          RESP=$(curl -s -m 30 -w "\n%{http_code}" https://menuya-hq-bot-production.up.railway.app/ping || echo -e "\n000")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $CODE :: $BODY"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          mkdir -p metricas
          echo "{\"ts\":\"$(date -u +%FT%TZ)\",\"http\":$CODE,\"salud\":$(echo "$BODY" | head -c 200 | jq -R . 2>/dev/null || echo null)}" >> metricas/heartbeat.jsonl
          tail -100 metricas/heartbeat.jsonl > /tmp/hb && mv /tmp/hb metricas/heartbeat.jsonl

      - name: Guardar heartbeat en el repo
        run: |
          git config user.name "menuya-watchdog"
          git config user.email "watchdog@menuya.cr"
          git add metricas/heartbeat.jsonl
          git diff --cached --quiet || git commit -m "heartbeat $(date -u +%F-%T)"
          git push

      - name: Abrir alerta si el bot no responde
        if: steps.check.outputs.code != '200'
        run: |
          gh issue create \
            --title "🚨 MenúYa HQ no responde (HTTP ${{ steps.check.outputs.code }})" \
            --body "El vigilante externo detectó que el bot no responde a las $(date -u +%F\ %T) UTC. Revisar Railway: proyecto menuya-hq, servicio menuya-hq-bot." \
            --label "alerta" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
