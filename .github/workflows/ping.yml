name: Ping ligero MenúYa HQ

# Cada 30 min verifica que el bot responda. Solo abre issue si cae.
# No hace commits (el workflow "vigilante" de cada 6h guarda el historial).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al bot
        id: ping
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://menuya-hq-bot-production.up.railway.app/ping || echo "000")
          echo "HTTP $CODE"
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Abrir alerta si no responde
        if: steps.ping.outputs.code != '200'
        run: |
          # evitar duplicados: solo si no hay issue abierto reciente
          ABIERTO=$(gh issue list --label alerta --state open --json number --jq 'length')
          if [ "$ABIERTO" = "0" ]; then
            gh issue create --title "🚨 MenúYa HQ no responde (HTTP ${{ steps.ping.outputs.code }})" \
              --body "Ping ligero cada 30min detectó caída a las $(date -u +%F\ %T) UTC." --label "alerta"
          else
            echo "ya hay alerta abierta, no duplico"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
